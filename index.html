<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>달력</title>
<style>
body{font-family:'Malgun Gothic',sans-serif;background:#f4f5f7;margin:0;padding:20px;text-align:center}
#cal{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;background:#fff;padding:20px;border-radius:12px;max-width:1100px;margin:auto}
.m{width:300px}.m h3{margin:6px 0 10px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.h{font-weight:bold;font-size:13px;padding:4px 0}
.d{padding:8px 0;border-radius:6px;cursor:pointer;user-select:none;background:#f0f1f3}
.d:hover{background:#dde3ea}.sun{color:#e03131}.sat{color:#1c7ed6}
.d.on{background:#ff922b;color:#fff;font-weight:bold}
button{margin:20px 6px;padding:12px 28px;font-size:16px;border:0;border-radius:8px;cursor:pointer;background:#fee500;font-weight:bold}
#reset{background:#dee2e6}#name{padding:11px;font-size:16px;border:1px solid #ccc;border-radius:8px;width:180px}
#saved button{background:#e7f5ff;margin:6px}#saved button.cur{background:#339af0;color:#fff}#msg{color:#555;font-size:14px}
</style></head><body>
<div id="cal"></div>
<div><input id="name" placeholder="이름을 적어주세요"><button id="save">저장</button><button id="reset" style="display:none">초기화</button></div>
<div id="saved"></div>
<div id="msg"></div>
<script>
const months=[[2026,10],[2026,11],[2026,12],[2027,1],[2027,2]];
const KEY='mycal-selected';let sel=new Set();localStorage.removeItem(KEY);
const cal=document.getElementById('cal');
months.forEach(([y,m])=>{
 const box=document.createElement('div');box.className='m';
 box.innerHTML=`<h3>${y}년 ${m}월</h3>`;const g=document.createElement('div');g.className='g';
 '일월화수목금토'.split('').forEach((w,i)=>{g.innerHTML+=`<div class="h ${i==0?'sun':i==6?'sat':''}">${w}</div>`});
 const first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate();
 for(let i=0;i<first;i++)g.appendChild(document.createElement('div'));
 for(let d=1;d<=n;d++){const c=document.createElement('div'),id=`${y}-${m}-${d}`,w=(first+d-1)%7;
  c.className='d'+(w==0?' sun':w==6?' sat':'')+(sel.has(id)?' on':'');c.textContent=d;c.dataset.id=id;
  c.onclick=()=>{c.classList.toggle('on');c.classList.contains('on')?sel.add(id):sel.delete(id)};
  g.appendChild(c)}
 box.appendChild(g);cal.appendChild(box)});
const API='https://api.restful-api.dev/objects/ff808181a09d98f701a16213e1294e36';let saved={};
const msg=t=>document.getElementById('msg').textContent=t;
const NETERR='인터넷 연결을 확인하고 잠시 후 다시 시도해 주세요.';
async function load(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw r.status;const j=await r.json();return (j.data&&j.data.entries)||{}}
async function put(e){const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'mycal',data:{entries:e}})});if(!r.ok)throw r.status}
async function refresh(){try{saved=await load();render()}catch(e){msg('저장된 목록을 불러오지 못했어요. '+NETERR)}}
function show(list){sel=new Set(list);
 document.querySelectorAll('.d').forEach(c=>c.classList.toggle('on',sel.has(c.dataset.id)))}
function render(){const box=document.getElementById('saved');box.innerHTML='';
 Object.keys(saved).forEach(n=>{const b=document.createElement('button');b.textContent=n;
  b.onclick=()=>{show(saved[n]);document.getElementById('name').value=n;
   box.querySelectorAll('button').forEach(x=>x.classList.remove('cur'));b.classList.add('cur');msg(n+'님이 저장한 날짜예요.')};
  box.appendChild(b)})}
document.getElementById('save').onclick=async()=>{const n=document.getElementById('name').value.trim();
 if(!n){msg('이름을 먼저 적어주세요.');return}
 msg('저장하는 중...');
 try{const cur=await load();cur[n]=[...sel];await put(cur);saved=cur;render();show([]);document.getElementById('name').value='';msg(n+' 저장했어요.')}
 catch(e){msg('저장하지 못했어요. '+NETERR)}};
document.getElementById('reset').onclick=async()=>{if(!confirm('저장된 내용을 모두 지울까요? 모든 사람의 기록이 지워져요.'))return;
 try{await put({});saved={};show([]);render();msg('모두 지웠어요.')}catch(e){msg('지우지 못했어요. '+NETERR)}};
refresh();
</script></body></html>
